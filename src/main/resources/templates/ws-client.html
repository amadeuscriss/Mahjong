<!DOCTYPE html>

<script>
    let ws = new WebSocket("ws://localhost:8080/ws");

    ws.open = function () {
        ws.send("hello");
    }

    ws.message = function (message) {
        console.log("Received message: " + message.data);
    }
</script>
